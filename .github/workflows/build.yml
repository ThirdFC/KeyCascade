name: Build KeyCascade

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable
        shell: powershell
        run: ./build.ps1
      - name: Package executable and documentation
        shell: pwsh
        run: Compress-Archive -LiteralPath release/KeyCascade.exe,release/KeyCascade.exe.config,release/README.md,release/docs -DestinationPath KeyCascade-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KeyCascade-Windows-x64
          path: KeyCascade-Windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KeyCascade-Windows-x64
          path: release-artifact
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifact/KeyCascade-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --title "KeyCascade $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
